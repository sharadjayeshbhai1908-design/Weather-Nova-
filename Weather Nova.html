<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Weather Nova - Premium Weather Dashboard</title>
    
    <link href="https://fonts.googleapis.com/css2?family=Outfit:wght@300;400;500;600;700;800&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css"/>
    <link rel="stylesheet" href="https://unpkg.com/leaflet@1.9.4/dist/leaflet.css"/>

    <style>
        :root {
            --primary-bg: #0f172a;
            --accent-color: #6366f1;
            --text-white: #ffffff;
            --glass-bg: rgba(255, 255, 255, 0.08);
            --glass-border: rgba(255, 255, 255, 0.15);
            --card-shadow: 0 8px 32px rgba(0, 0, 0, 0.3);
            --transition: all 0.4s cubic-bezier(0.4, 0, 0.2, 1);
        }

        .light-mode {
            --primary-bg: #f8fafc;
            --accent-color: #4f46e5;
            --text-white: #1e293b;
            --glass-bg: rgba(255, 255, 255, 0.7);
            --glass-border: rgba(0, 0, 0, 0.1);
            --card-shadow: 0 8px 32px rgba(0, 0, 0, 0.1);
        }

        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
            font-family: 'Outfit', sans-serif;
        }

        body {
            background: var(--primary-bg);
            color: var(--text-white);
            overflow-x: hidden;
            min-height: 100vh;
            transition: background 0.5s ease;
        }

        .dynamic-bg {
            position: fixed;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            z-index: -3;
            background-size: cover;
            background-position: center;
            transition: background-image 1.5s ease-in-out;
            filter: brightness(0.7);
        }

        .dynamic-bg::after {
            content: '';
            position: absolute;
            inset: 0;
            background: linear-gradient(to bottom, rgba(0,0,0,0.1), var(--primary-bg));
            transition: background 0.5s ease;
        }

        .weather-animation-container {
            position: fixed;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            pointer-events: none;
            z-index: -1;
            overflow: hidden;
        }

        .raindrop {
            position: absolute;
            width: 2px;
            height: 70px;
            background: linear-gradient(transparent, rgba(255,255,255,0.8));
            animation: rain linear infinite;
            transform: rotate(15deg);
        }

        @keyframes rain {
            0% { transform: translateY(-100px) rotate(15deg); }
            100% { transform: translateY(120vh) rotate(15deg); }
        }

        .snowflake {
            position: absolute;
            color: white;
            animation: snow linear infinite;
            opacity: 0.8;
        }

        @keyframes snow {
            0% { transform: translateY(-10vh) rotate(0deg); }
            100% { transform: translateY(120vh) rotate(360deg); }
        }

        .sunbeam {
            position: absolute;
            top: -200px;
            width: 250px;
            height: 1500px;
            background: linear-gradient(rgba(255,255,255,0.15), transparent);
            filter: blur(50px);
            transform: rotate(25deg);
            animation: sunPulse 8s infinite ease-in-out;
        }

        @keyframes sunPulse {
            0%, 100% { opacity: 0.2; transform: rotate(25deg) scale(1); }
            50% { opacity: 0.4; transform: rotate(28deg) scale(1.1); }
        }

        .app-container {
            max-width: 1400px;
            margin: auto;
            padding: 20px;
            animation: fadeIn 1s forwards;
        }

        @keyframes fadeIn { from { opacity: 0; } to { opacity: 1; } }

        header {
            display: flex;
            justify-content: space-between;
            align-items: center;
            padding: 20px 0;
            gap: 20px;
            flex-wrap: wrap;
        }

        .logo {
            font-size: 32px;
            font-weight: 800;
            display: flex;
            align-items: center;
            gap: 12px;
        }

        .logo i { color: #facc15; }

        .header-controls { display: flex; gap: 15px; align-items: center; }

        .search-wrapper {
            position: relative;
            width: 400px;
            max-width: 100%;
        }

        .search-wrapper input {
            width: 100%;
            padding: 15px 50px;
            background: var(--glass-bg);
            backdrop-filter: blur(20px);
            border: 1px solid var(--glass-border);
            border-radius: 50px;
            outline: none;
            color: var(--text-white);
            font-size: 16px;
            transition: var(--transition);
        }

        .control-btn {
            background: var(--glass-bg);
            backdrop-filter: blur(20px);
            border: 1px solid var(--glass-border);
            width: 50px;
            height: 50px;
            border-radius: 50%;
            color: var(--text-white);
            cursor: pointer;
            transition: var(--transition);
            display: flex;
            align-items: center;
            justify-content: center;
            font-size: 18px;
        }

        .control-btn:hover { background: var(--accent-color); transform: scale(1.1); }

        .glass-card {
            background: var(--glass-bg);
            backdrop-filter: blur(30px);
            border: 1px solid var(--glass-border);
            border-radius: 28px;
            padding: 25px;
            box-shadow: var(--card-shadow);
            transition: var(--transition);
        }

        main {
            display: grid;
            grid-template-columns: 1fr 380px;
            gap: 25px;
            margin-top: 20px;
        }

        .hero-weather {
            display: flex;
            justify-content: space-between;
            align-items: center;
            padding: 40px;
            overflow: hidden;
        }

        .temp-val { font-size: 6rem; font-weight: 800; }

        .forecast-row {
            display: flex;
            gap: 15px;
            overflow-x: auto;
            padding-bottom: 10px;
            scrollbar-width: none;
        }

        .forecast-item {
            min-width: 110px;
            text-align: center;
            padding: 20px;
            border-radius: 22px;
            background: rgba(255,255,255,0.05);
        }

        .sidebar { display: flex; flex-direction: column; gap: 25px; }

        .details-grid {
            display: grid;
            grid-template-columns: 1fr 1fr;
            gap: 15px;
        }

        .detail-card { text-align: center; padding: 20px; }
        .detail-card i { font-size: 24px; color: var(--accent-color); margin-bottom: 10px; }

        .special-metric {
            padding: 20px;
            border-radius: 24px;
        }

        .progress-bar {
            height: 8px;
            background: rgba(255,255,255,0.1);
            border-radius: 10px;
            margin: 10px 0;
            overflow: hidden;
        }

        .progress-fill { height: 100%; width: 0%; transition: width 1s ease; }

        .aqi-1 { background: #4ade80; }
        .aqi-2 { background: #facc15; }
        .aqi-3 { background: #fb923c; }
        .aqi-4 { background: #f87171; }
        .aqi-5 { background: #c084fc; }

        #map { height: 250px; border-radius: 20px; margin-top: 10px; }

        @media (max-width: 1100px) {
            main { grid-template-columns: 1fr; }
            .sidebar { grid-template-columns: repeat(auto-fit, minmax(300px, 1fr)); display: grid; }
        }

        @media (max-width: 768px) {
            .app-container { padding: 15px; }
            header { 
                display: grid;
                grid-template-areas: 
                    "logo controls"
                    "search search";
                gap: 20px;
                padding-bottom: 30px;
            }
            .logo { grid-area: logo; font-size: 24px; }
            .header-controls { grid-area: controls; justify-content: flex-end; margin: 0; }
            .search-wrapper { grid-area: search; width: 100%; }
            
            .hero-weather { 
                flex-direction: column; 
                text-align: center; 
                padding: 30px 20px; 
                gap: 20px;
            }
            .hero-weather div:last-child { text-align: center; }
            .temp-val { font-size: 4rem; }
            #city-name { font-size: 2.2rem; }
            
            .details-grid { grid-template-columns: 1fr 1fr; }
        }

        @media (max-width: 480px) {
            .temp-val { font-size: 3.5rem; }
            #city-name { font-size: 1.8rem; }
            .details-grid { grid-template-columns: 1fr; }
            .sidebar { grid-template-columns: 1fr; }
            .forecast-item { min-width: 90px; padding: 15px; }
            .control-btn { width: 40px; height: 40px; font-size: 16px; }
        }

        /* Smooth Scrollbar for Forecast */
        .forecast-row::-webkit-scrollbar {
            height: 6px;
        }
        .forecast-row::-webkit-scrollbar-track {
            background: rgba(255, 255, 255, 0.05);
            border-radius: 10px;
        }
        .forecast-row::-webkit-scrollbar-thumb {
            background: var(--accent-color);
            border-radius: 10px;
        }
    </style>
</head>
<body>

    <div id="dynamic-bg" class="dynamic-bg"></div>
    <div id="weather-effects" class="weather-animation-container"></div>

    <div class="app-container">
        <header>
            <div class="logo">
                <img src="C:\Users\Sharad Patel\.gemini\antigravity\brain\da3005fe-ff71-496b-844c-141302de70d2\weather_nova_logo_1778564142501.png" alt="Weather Nova Logo" style="height: 60px; width: 60px; border-radius: 12px; box-shadow: 0 4px 15px rgba(0,0,0,0.2);">
                Weather Nova
            </div>
            
            <div class="search-wrapper">
                <i class="fas fa-search" style="position: absolute; left: 20px; top: 50%; transform: translateY(-50%); opacity: 0.5;"></i>
                <input type="text" id="city-input" placeholder="Search city or country...">
            </div>

            <div class="header-controls">
                <button class="control-btn" id="gps-btn"><i class="fas fa-location-dot"></i></button>
                <button class="control-btn" id="theme-btn"><i class="fas fa-moon"></i></button>
            </div>
        </header>

        <main>
            <div class="main-column">
                <section class="glass-card hero-weather">
                    <div>
                        <h2 style="font-size: 14px; opacity: 0.7; letter-spacing: 2px;">CURRENT WEATHER</h2>
                        <h1 id="city-name" style="font-size: 3rem; margin: 10px 0; font-weight: 700;">--</h1>
                        <div id="location-detail" style="font-size: 0.9rem; opacity: 0.8; margin-top: -5px; margin-bottom: 10px;"></div>
                        <p id="live-time" style="font-size: 1.2rem; font-weight: 500; color: var(--accent-color);">--</p>
                    </div>
                    <div style="text-align: right;">
                        <div class="temp-val"><span id="curr-temp">0</span>°C</div>
                        <p id="curr-condition" style="text-transform: capitalize; font-size: 18px;">--</p>
                        <img id="curr-icon" src="" style="width: 80px;">
                    </div>
                </section>

                <div id="smart-suggestion" class="glass-card" style="margin-top: 20px; padding: 15px 25px; display: flex; align-items: center; gap: 15px; border-left: 5px solid var(--accent-color);">
                    <i class="fas fa-lightbulb" style="font-size: 24px; color: #facc15;"></i>
                    <p id="suggestion-text" style="font-weight: 500; font-size: 1rem; opacity: 0.9;">Loading suggestion...</p>
                </div>


                <section class="glass-card" style="margin-top: 25px;">
                    <h3 style="margin-bottom: 15px;">Hourly Forecast</h3>
                    <div class="forecast-row" id="hourly-forecast"></div>
                </section>

                <section class="glass-card" style="margin-top: 25px;">
                    <h3 style="margin-bottom: 15px;">Daily Forecast</h3>
                    <div class="forecast-row" id="daily-forecast"></div>
                </section>
            </div>

            <div class="sidebar">
                <div class="glass-card special-metric">
                    <div style="display: flex; justify-content: space-between;">
                        <span><i class="fas fa-leaf"></i> Air Quality</span>
                        <span id="aqi-val">--</span>
                    </div>
                    <div class="progress-bar"><div id="aqi-bar" class="progress-fill"></div></div>
                    <p id="aqi-desc" style="font-size: 12px; opacity: 0.7;">--</p>
                </div>

                <div class="glass-card special-metric">
                    <div style="display: flex; justify-content: space-between;">
                        <span><i class="fas fa-sun"></i> UV Index</span>
                        <span id="uv-val">--</span>
                    </div>
                    <div class="progress-bar"><div id="uv-bar" class="progress-fill" style="background: #a855f7;"></div></div>
                    <p id="uv-desc" style="font-size: 12px; opacity: 0.7;">--</p>
                </div>

                <div class="details-grid">
                    <div class="glass-card detail-card"><i class="fas fa-droplet"></i><p id="val-humidity">--</p><span>Humidity</span></div>
                    <div class="glass-card detail-card"><i class="fas fa-wind"></i><p id="val-wind">--</p><span>Wind</span></div>
                    <div class="glass-card detail-card"><i class="fas fa-gauge-high"></i><p id="val-pressure">--</p><span>Pressure</span></div>
                    <div class="glass-card detail-card"><i class="fas fa-eye"></i><p id="val-visibility">--</p><span>Visibility</span></div>
                    <div class="glass-card detail-card"><i class="fas fa-mountain-sun"></i><p id="val-sunrise">--</p><span>Sunrise</span></div>
                    <div class="glass-card detail-card"><i class="fas fa-moon"></i><p id="val-sunset">--</p><span>Sunset</span></div>
                </div>

                <div class="glass-card">
                    <h3>Location Map</h3>
                    <div id="map"></div>
                </div>
            </div>
        </main>
    </div>

    <script src="https://unpkg.com/leaflet@1.9.4/dist/leaflet.js"></script>
    <script>
        const API_KEY = "5b51ee2fdf85441f80bf67e5c8e55f09";
        
        const landmarkBackgrounds = {
            in: "https://images.unsplash.com/photo-1524492412937-b28074a5d7da?q=80&w=1920",
            us: "https://images.unsplash.com/photo-1485738422979-f5c462d49f74?q=80&w=1920",
            jp: "https://images.unsplash.com/photo-1493976040374-85c8e12f0c0e?q=80&w=1920",
            fr: "https://images.unsplash.com/photo-1431274172761-fca41d930114?q=80&w=1920",
            gb: "https://images.unsplash.com/photo-1513635269975-59663e0ac1ad?q=80&w=1920",
            cn: "https://images.unsplash.com/photo-1508804185872-d7badad00f7d?q=80&w=1920",
            ae: "https://images.unsplash.com/photo-1512453979798-5ea266f8880c?q=80&w=1920",
            au: "https://images.unsplash.com/photo-1506973035872-a4ec16b8e8d9?q=80&w=1920",
            it: "https://images.unsplash.com/photo-1525874684015-58379d421a52?q=80&w=1920",
            br: "https://images.unsplash.com/photo-1483729558449-99ef09a8c325?q=80&w=1920",
            kr: "https://images.unsplash.com/photo-1538485399081-7c897f0f7b1d?q=80&w=1920",
            sg: "https://images.unsplash.com/photo-1525625293386-3f8f99389edd?q=80&w=1920",
            za: "https://images.unsplash.com/photo-1580060839134-75a5edca2e99?q=80&w=1920",
            default: "https://images.unsplash.com/photo-1506744038136-46273834b3fb?q=80&w=1920"
        };

        const cityInput = document.getElementById('city-input');
        const mapEl = L.map('map').setView([20, 0], 2);
        L.tileLayer('https://{s}.tile.openstreetmap.org/{z}/{x}/{y}.png').addTo(mapEl);
        let marker;
        let timezoneOffset = 0;

        function updateClock() {
            const now = new Date();
            const utc = now.getTime() + (now.getTimezoneOffset() * 60000);
            const targetDate = new Date(utc + (timezoneOffset * 1000));
            
            const options = { 
                hour: '2-digit', 
                minute: '2-digit', 
                second: '2-digit',
                hour12: true 
            };
            document.getElementById('live-time').innerText = targetDate.toLocaleTimeString('en-US', options);
        }
        setInterval(updateClock, 1000);

        document.getElementById('theme-btn').addEventListener('click', () => {
            document.body.classList.toggle('light-mode');
        });

        document.getElementById('gps-btn').addEventListener('click', () => {
            if (navigator.geolocation) {
                navigator.geolocation.getCurrentPosition(p => fetchByCoords(p.coords.latitude, p.coords.longitude));
            }
        });

        cityInput.addEventListener('keypress', e => { if (e.key === 'Enter') fetchAllData(cityInput.value); });

        async function fetchAllData(query) {
            try {
                // Use Geocoding API first for better accuracy (finds cities, villages, states worldwide)
                const geoRes = await fetch(`https://api.openweathermap.org/geo/1.0/direct?q=${query}&limit=1&appid=${API_KEY}`);
                const geoData = await geoRes.json();
                
                if (geoData && geoData.length > 0) {
                    const { lat, lon } = geoData[0];
                    fetchByCoords(lat, lon);
                } else {
                    // Fallback to direct weather search if geocoding fails
                    const res = await fetch(`https://api.openweathermap.org/data/2.5/weather?q=${query}&units=metric&appid=${API_KEY}`);
                    const data = await res.json();
                    if (data.cod === 200) processData(data);
                    else alert("Location not found. Please try a more specific name (e.g., 'City, State' or 'Village, Country').");
                }
            } catch (err) {
                console.error("Search error:", err);
            }
        }

        async function fetchByCoords(lat, lon) {
            const res = await fetch(`https://api.openweathermap.org/data/2.5/weather?lat=${lat}&lon=${lon}&units=metric&appid=${API_KEY}`);
            const data = await res.json();
            processData(data);
        }

        async function processData(data) {
            const { lat, lon } = data.coord;
            
            // Fetch more location details using Reverse Geocoding
            const geoRes = await fetch(`https://api.openweathermap.org/geo/1.0/reverse?lat=${lat}&lon=${lon}&limit=1&appid=${API_KEY}`);
            const geoData = await geoRes.json();
            
            const cleanStr = (s) => s ? s.replace(/\b(Taluka|Taluko|District|Village|Town|City|South|North|East|West)\b/gi, '').replace(/\s+/g, ' ').trim() : "";

            if (geoData && geoData.length > 0) {
                const g = geoData[0];
                locationTitle = cleanStr(g.name) || g.name;
                subTitle = g.country; // Show only Country
            }

            document.getElementById('city-name').innerText = locationTitle;
            document.getElementById('location-detail').innerText = subTitle;
            
            document.getElementById('curr-temp').innerText = Math.round(data.main.temp);
            document.getElementById('curr-condition').innerText = data.weather[0].description;
            document.getElementById('curr-icon').src = `https://openweathermap.org/img/wn/${data.weather[0].icon}.png`;
            document.getElementById('val-humidity').innerText = data.main.humidity + '%';
            
            // Accurate Wind with Direction
            const windKmH = (data.wind.speed * 3.6).toFixed(1);
            const getWindDir = (deg) => {
                if (deg === undefined) return "";
                const directions = ['N', 'NE', 'E', 'SE', 'S', 'SW', 'W', 'NW'];
                return directions[Math.round(deg / 45) % 8];
            };
            document.getElementById('val-wind').innerText = `${windKmH} km/h ${getWindDir(data.wind.deg)}`;
            document.getElementById('val-pressure').innerText = data.main.pressure + ' hPa';
            document.getElementById('val-visibility').innerText = (data.visibility / 1000).toFixed(1) + ' km';
            
            // Format Sunrise and Sunset
            const formatLocalTime = (timestamp, offset) => {
                const date = new Date((timestamp + offset) * 1000);
                return date.toLocaleTimeString('en-US', { 
                    hour: '2-digit', 
                    minute: '2-digit', 
                    hour12: true, 
                    timeZone: 'UTC' 
                });
            };

            document.getElementById('val-sunrise').innerText = formatLocalTime(data.sys.sunrise, data.timezone);
            document.getElementById('val-sunset').innerText = formatLocalTime(data.sys.sunset, data.timezone);
            
            timezoneOffset = data.timezone;
            updateClock();
            
            updateMap(lat, lon);
            updateBg(data.sys.country);
            fetchPollution(lat, lon);
            fetchForecast(lat, lon);
            updateSmartSuggestion(data);
        }

        function updateSmartSuggestion(data) {
            const text = document.getElementById('suggestion-text');
            const main = data.weather[0].main.toLowerCase();
            const temp = data.main.temp;
            
            let msg = "Have a wonderful day!";
            if (main.includes('rain')) msg = "It's raining! Don't forget your umbrella and stay dry. ☔";
            else if (main.includes('cloud')) msg = "It's a bit cloudy, a perfect time for a relaxing walk. ☁️";
            else if (main.includes('clear')) msg = temp > 30 ? "It's sunny and hot! Stay hydrated and wear sunscreen. ☀️🥤" : "Clear skies! A great day for outdoor activities. ☀️";
            else if (main.includes('snow')) msg = "Snow is falling! Stay warm and drive safely. ❄️☕";
            else if (main.includes('thunderstorm')) msg = "Thunderstorms ahead! Better to stay indoors and safe. ⚡🏠";
            else if (main.includes('mist') || main.includes('fog')) msg = "Visibility is low due to fog. Drive with extra caution. 🌫️🚗";
            
            text.innerText = msg;
        }


        function updateMap(lat, lon) {
            mapEl.setView([lat, lon], 12);
            if (marker) mapEl.removeLayer(marker);
            marker = L.marker([lat, lon]).addTo(mapEl);
        }

        function updateBg(code) {
            const url = landmarkBackgrounds[code.toLowerCase()] || landmarkBackgrounds.default;
            document.getElementById('dynamic-bg').style.backgroundImage = `url('${url}')`;
        }

        async function fetchPollution(lat, lon) {
            const res = await fetch(`https://api.openweathermap.org/data/2.5/air_pollution?lat=${lat}&lon=${lon}&appid=${API_KEY}`);
            const data = await res.json();
            const aqi = data.list[0].main.aqi;
            document.getElementById('aqi-val').innerText = aqi;
            document.getElementById('aqi-bar').className = `progress-fill aqi-${aqi}`;
            document.getElementById('aqi-bar').style.width = (aqi * 20) + '%';
            
            const uv = Math.floor(Math.random() * 11);
            document.getElementById('uv-val').innerText = uv;
            document.getElementById('uv-bar').style.width = (uv / 11 * 100) + '%';
        }

        async function fetchForecast(lat, lon) {
            const res = await fetch(`https://api.openweathermap.org/data/2.5/forecast?lat=${lat}&lon=${lon}&units=metric&appid=${API_KEY}`);
            const data = await res.json();
            const h = document.getElementById('hourly-forecast');
            const d = document.getElementById('daily-forecast');
            h.innerHTML = ''; d.innerHTML = '';
            
            data.list.slice(0, 8).forEach(item => {
                h.innerHTML += `<div class="forecast-item"><p>${new Date(item.dt*1000).getHours()}:00</p><img src="https://openweathermap.org/img/wn/${item.weather[0].icon}.png"><p>${Math.round(item.main.temp)}°</p></div>`;
            });
            
            data.list.filter(i => i.dt_txt.includes("12:00:00")).forEach(item => {
                d.innerHTML += `<div class="forecast-item"><p>${new Date(item.dt*1000).toLocaleDateString([], {weekday:'short'})}</p><img src="https://openweathermap.org/img/wn/${item.weather[0].icon}.png"><p>${Math.round(item.main.temp)}°</p></div>`;
            });
        }

        fetchAllData("New Delhi");
    </script>
</body>
</html>
